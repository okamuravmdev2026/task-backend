spring.application.name=task-backend

# ==========================================
# 🛢️ PostgreSQL / RDS 接続設定
# ==========================================
# ローカルでテストする間は localhost にしておきます（AWSに載せたらURLに書き換えます）
#spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.url=jdbc:postgresql://task-rds.c56casy00eix.ap-northeast-1.rds.amazonaws.com:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=password123
